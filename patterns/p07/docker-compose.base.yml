services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
    # No named volume: data lives in the container's ephemeral layer and is
    # wiped on `docker compose down`, giving every test run a clean database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Generates CA, server cert (for mTLS bootstrap listener), and worker device cert.
  # All three manager replicas share the same server cert (SAN=manager).
  # All three worker replicas share the same device cert (CN=worker).
  certs-init:
    image: alpine:3.20
    command: |
      sh -c '
        apk add --no-cache openssl > /dev/null 2>&1

        # Idempotent: skip if certs already exist (e.g. volume reuse)
        [ -f /certs/ca.crt ] && echo "Certificates already exist, skipping" && exit 0

        set -e

        # CA
        openssl genrsa -out /certs/ca.key 4096 2>/dev/null
        openssl req -x509 -new -nodes -key /certs/ca.key \
          -sha256 -days 3650 \
          -out /certs/ca.crt \
          -subj "/CN=work-dist-ca"

        # Server cert for manager bootstrap listener (:8083)
        # SAN must include the Docker service name so workers can verify it.
        openssl genrsa -out /certs/server.key 2048 2>/dev/null
        openssl req -new -key /certs/server.key \
          -out /tmp/server.csr \
          -subj "/CN=manager"
        printf "subjectAltName = DNS:manager,DNS:localhost\nextendedKeyUsage = serverAuth\n" > /tmp/server.ext
        openssl x509 -req -in /tmp/server.csr \
          -CA /certs/ca.crt -CAkey /certs/ca.key -CAcreateserial \
          -out /certs/server.crt -days 3650 -sha256 \
          -extfile /tmp/server.ext

        # Worker device cert (shared by all worker replicas; CN=worker)
        openssl genrsa -out /certs/worker.key 2048 2>/dev/null
        openssl req -new -key /certs/worker.key \
          -out /tmp/worker.csr \
          -subj "/CN=worker"
        printf "extendedKeyUsage = clientAuth\n" > /tmp/worker.ext
        openssl x509 -req -in /tmp/worker.csr \
          -CA /certs/ca.crt -CAkey /certs/ca.key -CAcreateserial \
          -out /certs/worker.crt -days 3650 -sha256 \
          -extfile /tmp/worker.ext

        echo "Certificates generated successfully"
      '
    volumes:
      - certs:/certs

  manager:
    build:
      context: ../..
      dockerfile: patterns/p07/Dockerfile.manager
    environment:
      - ADDR=:8081
      - BOOTSTRAP_ADDR=:8083
      - BROKER_URL=${BROKER_URL}
      - DATABASE_URL=postgres://tasks:tasks@postgres:5432/tasks?sslmode=disable
      - TOKEN_SECRET=demo-secret-change-in-production
      - TOKEN_TTL_MINS=15
      - SERVER_CERT_PATH=/certs/server.crt
      - SERVER_KEY_PATH=/certs/server.key
      - CA_CERT_PATH=/certs/ca.crt
    volumes:
      - certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      certs-init:
        condition: service_completed_successfully
    restart: on-failure
    deploy:
      replicas: 3
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  api:
    build:
      context: ../..
      dockerfile: patterns/p07/Dockerfile.api
    environment:
      - ADDR=:8080
      - MANAGER_URL=http://manager:8081
      - BROKER_URL=${BROKER_URL}
    depends_on:
      manager:
        condition: service_healthy
    restart: on-failure
    deploy:
      replicas: 3
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  worker:
    build:
      context: ../..
      dockerfile: patterns/p07/Dockerfile.worker
    environment:
      - MANAGER_URL=https://manager:8083
      - CERT_PATH=/certs/worker.crt
      - KEY_PATH=/certs/worker.key
      - CA_PATH=/certs/ca.crt
    volumes:
      - certs:/certs:ro
    depends_on:
      manager:
        condition: service_healthy
      certs-init:
        condition: service_completed_successfully
    restart: on-failure
    deploy:
      replicas: 3
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  certs:
